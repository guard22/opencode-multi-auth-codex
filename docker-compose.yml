services:
  opencode-multi-auth:
    image: opencode-multi-auth-codex:local
    build:
      context: .
      target: runtime
    user: "1000:1000"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENCODE_MULTI_AUTH_PORT:-3434}:3434"
      - "127.0.0.1:1455:1455"
    volumes:
      - app_config:/home/node/.config
      - codex_auth:/home/node/.codex
      - codex_accounts:/home/node/.codex-multi
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  app_config:
  codex_auth:
  codex_accounts:
